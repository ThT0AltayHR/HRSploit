[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "HRSploit"
version = "1.0.0"
description = "HRSploit - Advanced Security Research Framework"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "urllib3>=1.26.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]

[tool.setuptools]
py-modules = ["HRSploit"]

[project.scripts]
hrsploit = "HRSploit:main"
